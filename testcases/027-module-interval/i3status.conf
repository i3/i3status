general {
        output_format = "none"
        interval = 5
}

order += "read_file INHERIT"
order += "read_file ZERO"
order += "read_file ONE"
order += "read_file LARGE"
order += "read_file UNDEFINED"

read_file INHERIT {
        path = "testcases/027-module-interval/short.txt"
}

read_file ZERO {
        path = "testcases/027-module-interval/short.txt"
        interval = 0
}

read_file ONE {
        path = "testcases/027-module-interval/short.txt"
        interval = 1
}

read_file LARGE {
        path = "testcases/027-module-interval/short.txt"
        interval = 2147483647
}
